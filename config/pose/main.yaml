defaults: default.yaml

paths:
  input_root: huojian/d455_penguan_20260525/penguan_zhuantai
  output_root: depth_outputs/d455_penguan_20260525/penguan_zhuantai
  icp_target_path: depth_outputs/d455_penguan_20260525/video/aruco_fusion/pose_graph_registration/merged_cloud_pose_graph_sam_cut_pca_aligned_mannual.ply
  stereo_model_path: jiegouguang/weights/FoundationStereo/23-51-11/model_best_bp2.pth
  ext_yaml_path: biaoding/extrinsics_d455_720p_20260526.yml
  int_yaml_path: biaoding/intrinsics_d455_720p_20260526.yml
  color_ext_yaml_path: biaoding/rgb_calib_d455_720p_20260526.yaml


reconstruction:
  brightness_mask:
    enabled: true
    threshold: 40

point_cloud:
  voxel_size_mm: 1.0
  min_depth_mm: 100.0
  max_depth_mm: 1000.0

segmentation:
  yolo_model_path: huojian/d455_penguan_20260525/video/huojian-500-640.pt
  yolo_conf: 0.25
  yolo_imgsz: 640
  yolo_device: null
  statistical_nb_neighbors: 20
  statistical_std_ratio: 2.0

icp:
  coarse_voxel_size_mm: 3.0
  coarse_max_correspondence_mm: 30.0
  coarse_iterations: 60
  fine_voxel_size_mm: 1.0
  fine_max_correspondence_mm: 10.0
  fine_iterations: 100
  fallback_fitness: 0.85

runtime:
  start_frame: 0
  end_frame: null
  keyframe_interval: 1
  continue_on_error: false
  profile_stages: false
